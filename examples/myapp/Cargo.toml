[package]
name = "MyApp"
version = "0.1.0"
edition = "2024"
authors = ["OpenSOVD Contributors"]
description = "ECU battery voltage monitor example"
license = "Apache-2.0"
repository = "https://github.com/eclipse-opensovd/opensovd-core"
keywords = ["sovd", "diagnostic"]
categories = ["embedded"]

[[bin]]
name = "myapp"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true, features = ["std"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
async-trait = { workspace = true }
opensovd-diagnostic-lib = { workspace = true }
