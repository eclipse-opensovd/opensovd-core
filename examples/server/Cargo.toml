[package]
name = "opensovd-examples-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[example]]
name = "bulkdata"
path = "bulkdata/bulkdata.rs"

[[example]]
name = "simple"
path = "simple/simple.rs"

[[example]]
name = "systemd"
path = "systemd/systemd.rs"

[[example]]
name = "auth"
path = "auth/auth.rs"


[[example]]
name = "mtls"
path = "mtls/mtls.rs"
required-features = ["tls"]

[features]
tls = ["opensovd-server/tls", "dep:rustls"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true, features = ["std", "async-await"] }
jsonwebtoken = { workspace = true }
libcli = { workspace = true }
opensovd-core = { workspace = true }
opensovd-extra = { workspace = true, features = ["auth"] }
opensovd-mocks = { workspace = true }
opensovd-models = { workspace = true }
opensovd-providers = { workspace = true }
opensovd-server = { workspace = true }
rustls = { workspace = true, optional = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "fs", "io-util"] }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { workspace = true }

[lints]
workspace = true
