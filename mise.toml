min_version = "2026.9.18"

[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
python = "3.13.15"
uv = "0.12.17"
prek = "0.5.4"
ruff = "0.16.9"
ty = "0.0.84"
"github:convco/convco" = "0.6.3"
cargo-deny = "0.20.2"
"github:taiki-e/cargo-llvm-cov" = "0.9.0"
"github:nextest-rs/nextest" = { version = "0.9.146", version_prefix = "cargo-nextest-" }
git-cliff = "2.14.1"
gh = "2.102.0"
jq = "1.8.2"

[env]
UV_PYTHON = { value = "{% if tools.python %}{{ tools.python.path }}{% endif %}", tools = true }
UV_PYTHON_DOWNLOADS = "never"

[tasks.ci]
description = "Run the checks CI runs"
depends = ["lint", "build", "test", "licenses", "advisories"]

[tasks.build]
description = "Build the release binaries CI ships"
run = ["cargo build --locked --profile release-small -p opensovd-gateway", "cargo build --locked --profile release-small -p opensovd-mcp"]

[tasks.lint]
description = "Run the git hooks on all files"
run = "prek run --all-files --show-diff-on-failure"

[tasks.fmt]
description = "Format the Rust code with the pinned nightly rustfmt"
tools = { rust = { version = "nightly-2026-10-05", profile = "minimal", components = "rustfmt" } }
run = "cargo fmt --all"

[tasks."lint:commits"]
description = "Check that commit messages follow Conventional Commits"
usage = 'arg "[rev]" default="origin/main..HEAD" help="Commit or range to check"'
run = "convco check {{ usage.rev | quote }}"

[tasks.test]
description = "Run all tests"
depends = ["test:unit", "test:self", "test:integration"]

[tasks."test:unit"]
description = "Run the Rust tests"
run = ["cargo test --locked --workspace --all-features --doc", "cargo nextest run --locked --workspace --all-features"]

[tasks."test:self"]
description = "Run the pytest plugin self-tests"
run = "uv run --locked pytest opensovd-e2e/tests"

[tasks."test:integration"]
description = "Run the e2e tests"
run = "uv run --locked pytest tests/"

[tasks.coverage]
description = "Collect Rust and e2e coverage"
env = { CARGO_TARGET_DIR = "{{ config_root }}/target/coverage" }
run = '''
llvm_cov_env=$(cargo llvm-cov show-env --sh)
eval "$llvm_cov_env"
cargo llvm-cov clean --workspace
cargo nextest run --locked --workspace --all-features
uv run --locked pytest tests/
cargo llvm-cov report --json --output-path coverage.json
cargo llvm-cov report --html
cargo llvm-cov report --cobertura --output-path "$CARGO_TARGET_DIR/llvm-cov/html/cobertura.xml"
'''

[tasks.licenses]
description = "Check dependency licenses and sources"
run = "cargo deny check licenses sources"

[tasks.advisories]
description = "Check dependencies for security advisories"
run = "cargo deny check advisories"
