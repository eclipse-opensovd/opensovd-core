min_version = "2026.10.25"

[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]
disable_backends = [
  "aqua",
  "asdf",
  "cargo",
  "conda",
  "dotnet",
  "forgejo",
  "gem",
  "gitlab",
  "go",
  "http",
  "npm",
  "packslip",
  "pypi",
  "s3",
  "spinel",
  "spm",
  "ubi",
  "vfox",
]

[tool_config]
locked = true

[tools]
python = "3.13.15"
"github:astral-sh/uv" = "0.12.17"
"github:j178/prek" = "0.5.4"
"github:astral-sh/ruff" = "0.16.9"
"github:astral-sh/ty" = "0.0.84"
"github:convco/convco" = "0.6.3"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:taiki-e/cargo-llvm-cov" = "0.9.0"
"github:nextest-rs/nextest" = { version = "0.9.146", version_prefix = "cargo-nextest-" }
"github:orhun/git-cliff" = "2.14.1"
"github:cli/cli" = "2.102.0"
"github:github/gh-actions-lock" = { version = "0.4.1", bin = "gh-actions-lock" }
"github:jqlang/jq" = { version = "1.8.2", version_prefix = "jq-" }
"github:google/yamlfmt" = "0.21.0"
"github:akiomik/mado" = "0.4.0"
"github:koalaman/shellcheck" = "0.11.0"
"github:gitleaks/gitleaks" = "8.30.1"
"github:zizmorcore/zizmor" = "1.32.0"
"github:bnjbvr/cargo-machete" = "0.9.2"

[env]
UV_PYTHON = { value = "{% if tools.python %}{{ tools.python.path }}{% endif %}", tools = true }
UV_PYTHON_DOWNLOADS = "never"

[vars]
profile = "release-small"
binaries = "gateway mcp"

[task_templates.binaries]
usage = '''
arg "[binary]..." help="Binaries, all by default"
arg "[-- args]..."
'''

[tasks.ci]
description = "Run the checks CI runs"
depends = ["lint", "build", "test", "licenses", "advisories"]

[tasks.build]
description = "Build the release binaries"
extends = "binaries"
run = '''
{%- for b in usage.binary or vars.binaries | split(pat=" ") -%}
cargo build --locked --profile {{ vars.profile }} -p opensovd-{{ b }}{% for a in usage.args %} {{ a | quote }}{% endfor %}{% if not loop.last %} && {% endif %}
{%- endfor -%}
'''

[tasks.install-hooks]
description = "Let prek run the checks on every commit"
run = "prek install"
deny_all = true
allow_write = [".", "~"]

[tasks.lint]
description = "Run the git hooks on all files"
run = "prek run --all-files --show-diff-on-failure"

[tasks.fmt]
description = "Format the Rust code with the pinned nightly rustfmt"
tools = { rust = { version = "nightly-2026-10-05", profile = "minimal", components = "rustfmt" } }
run = "cargo fmt --all"
quiet = true
deny_all = true
allow_read = ["/"]
allow_write = ["."]
allow_env = ["CARGO_*", "RUST*"]

[tasks."fetch:rust"]
description = "Download the crates Cargo.lock pins"
run = "cargo fetch --locked --quiet"
quiet = true
hide = true

[tasks."fetch:python"]
description = "Install the Python packages uv.lock pins"
run = "uv sync --locked --quiet"
quiet = true
hide = true

[tasks."lint:rust"]
description = "Lint the Rust code with clippy"
depends = ["fetch:rust"]
run = "cargo clippy --locked --workspace --all-targets --all-features --no-deps -- -D warnings -A clippy::doc_markdown"
quiet = true
deny_all = true
allow_read = ["/"]
allow_write = ["."]
allow_env = ["CARGO_*", "RUST*"]

[tasks."lint:unused-deps"]
description = "Find unused Rust dependencies"
run = "cargo-machete"
quiet = true
deny_all = true
allow_read = ["."]

[tasks."lint:python"]
description = "Run ruff check on the given Python files"
run = "ruff check --force-exclude"
quiet = true
deny_all = true
allow_write = ["."]

[tasks."lint:python-format"]
description = "Run ruff format on the given Python files"
run = "ruff format --force-exclude"
quiet = true
deny_all = true
allow_write = ["."]

[tasks."lint:python-types"]
description = "Run ty on the Python tests"
depends = ["fetch:python"]
run = '''ty check --python "{{ env?.UV_PROJECT_ENVIRONMENT or '.venv' }}"'''
quiet = true
deny_all = true
allow_read = ["/"]

[tasks."lint:yaml-format"]
description = "Run yamlfmt on the given YAML files"
run = "yamlfmt"
quiet = true
deny_all = true
allow_write = ["."]

[tasks."lint:markdown"]
description = "Run mado on the given Markdown files"
run = "mado check"
quiet = true
deny_all = true
allow_read = ["."]

[tasks."lint:shell"]
description = "Run shellcheck on the given shell scripts"
run = "shellcheck"
quiet = true
deny_all = true
allow_read = ["."]

[tasks."lint:actions-security"]
description = "Run zizmor on the given workflow files"
run = "zizmor --no-progress --no-online-audits"
quiet = true
deny_all = true
allow_read = ["."]

[tasks."lint:actions-lock"]
description = "Check the actions lockfile against the workflows"
shell = "bash -c"
run = 'gh-actions-lock --verify-local --no-interactive || { echo "Update the lockfile with mise run lock:actions"; exit 1; }'
quiet = true
deny_all = true
allow_read = ["."]

[tasks."lint:secrets-staged"]
description = "Run gitleaks on the staged changes"
run = "gitleaks git --pre-commit --staged --redact --verbose --no-banner"
quiet = true
deny_all = true
allow_read = ["/"]
allow_env = ["GIT_*"]

[tasks."lint:commit-message"]
description = "Check that a commit message file follows Conventional Commits"
shell = "bash -c"
run = '''sh -c 'case "$(head -n 1 "$1")" in "Merge "*|"Revert "*|"fixup! "*|"squash! "*|"amend! "*) exit 0 ;; esac; convco check --strip --from-stdin < "$1"' --'''
quiet = true
deny_all = true
allow_read = ["/"]
allow_env = ["GIT_*"]

[tasks."lint:commits"]
description = "Check that commit messages follow Conventional Commits"
usage = 'arg "[rev]" default="origin/main..HEAD" help="Commit or range to check"'
run = "convco check --ignore-reverts {{ usage.rev | quote }}"
deny_all = true
allow_read = ["/"]

[tasks."lint:pr-title"]
description = "Check that a title on standard input follows Conventional Commits"
run = "convco check --from-stdin"
deny_all = true
allow_read = ["/"]

[tasks."lock:actions"]
description = "Update the actions lockfile"
run = "gh-actions-lock --no-narrow --no-interactive"

[tasks.test]
description = "Run all tests"
depends = ["test:unit", "test:self", "test:integration"]

[tasks."test:unit"]
description = "Run the Rust tests"
extends = "binaries"
shell = "bash -c"
run = '''
{%- set triple = env?.CARGO_BUILD_TARGET or [l | split(pat=": ") | last for l in exec(command="rustc -vV") | split(pat="\n") if "host: " in l] | first -%}
set -e
junit="${CARGO_TARGET_DIR:-target}/nextest/default/junit.xml"
{% for b in usage.binary or vars.binaries | split(pat=" ") -%}
{%- set crates = [line | split(pat=" ") | first for line in exec(command="cargo tree --locked -p opensovd-" ~ b ~ " -e normal,build --prefix none --format {p}") | split(pat="\n") if config_root in line and "(*)" not in line] -%}
report={{ ("target/reports/" ~ b ~ "/" ~ triple ~ "/unit") | quote }}
rm -f "$junit"
status=0
cargo nextest run --locked --all-features{% for c in crates %} -p {{ c }}{% endfor %}{% for a in usage.args %} {{ a | quote }}{% endfor %} || status=$?
if [ -f "$junit" ]; then mkdir -p "$report" && cp "$junit" "$report/junit.xml"; fi
if [ "$status" -ne 0 ]; then exit "$status"; fi
cargo test --locked --doc --all-features{% for c in crates %} -p {{ c }}{% endfor %}
{% endfor -%}
'''

[tasks."test:self"]
description = "Run the pytest plugin self-tests"
run = "uv run --locked pytest opensovd-e2e/tests"

[tasks."test:integration"]
description = "Run the e2e tests"
extends = "binaries"
run = '''
{%- set triple = env?.CARGO_BUILD_TARGET or [l | split(pat=": ") | last for l in exec(command="rustc -vV") | split(pat="\n") if "host: " in l] | first -%}
{%- for b in usage.binary or vars.binaries | split(pat=" ") -%}
uv run --locked pytest tests/opensovd-{{ b }} --opensovd-profile={{ vars.profile }}
{%- if env?.CARGO_BUILD_TARGET %} --opensovd-target={{ triple }}{% endif %}
{{- " " }}--html=target/reports/{{ b }}/{{ triple }}/integration/index.html --self-contained-html --metadata Binary {{ b }} --metadata Target {{ triple }}
{%- for a in usage.args %} {{ a | quote }}{% endfor %}
{%- if not loop.last %} && {% endif %}
{%- endfor -%}
'''

[tasks.coverage]
description = "Collect coverage per binary, or merge the collected coverage"
extends = "binaries"
usage = '''
flag "--tests <tests>" default="unit,integration" help="Test stages to cover"
flag "--merge" help="Report the binaries together from their collected coverage instead of running tests"
'''
env = { CARGO_TARGET_DIR = "{{ config_root }}/target/coverage" }
run = '''
{%- set triple = env?.CARGO_BUILD_TARGET or [l | split(pat=": ") | last for l in exec(command="rustc -vV") | split(pat="\n") if "host: " in l] | first -%}
{%- set tests = usage.tests | split(pat=",") -%}
{%- set binaries = usage.binary or vars.binaries | split(pat=" ") -%}
{%- set data = config_root ~ "/target/coverage-data" -%}
{%- set build_dir = (triple ~ "/" if env?.CARGO_BUILD_TARGET else "") ~ "debug" -%}
{% if usage.merge %}export CARGO_TARGET_DIR="$CARGO_TARGET_DIR/merge"
{% endif -%}
llvm_cov_env=$(cargo llvm-cov show-env --sh)
eval "$llvm_cov_env"
report() { cargo llvm-cov report --ignore-filename-regex /opensovd-mocks/ "$@"; }
reports() {
  rm -rf "$1" && mkdir -p "$1"
  report --json --output-path "$1/coverage.json"
  report --html --output-dir "$1"
  report --cobertura --output-path "$1/cobertura.xml"
  scripts/coverage-report.sh --name "$2" "$1/coverage.json" > "$1/summary.md"
  scripts/coverage-report.sh --detail --name "$2" "$1/coverage.json" > "$1/detail.md"
  scripts/coverage-report.sh --badge "$1/coverage.json" > "$1/badge.json"
}
{% if usage.merge -%}
rm -rf "$CARGO_TARGET_DIR" && mkdir -p "$CARGO_TARGET_DIR"
{% for b in binaries -%}
tar -xzf {{ (data ~ "/" ~ b ~ "-" ~ triple ~ ".tar.gz") | quote }} -C "$CARGO_TARGET_DIR"
{% endfor -%}
reports {{ (config_root ~ "/target/reports/all/" ~ triple ~ "/coverage") | quote }} {{ (binaries | join(sep=" and ") ~ " on " ~ triple) | quote }}
{% else -%}
objcopy="$(rustc --print sysroot)/lib/rustlib/$(rustc --print host-tuple)/bin/llvm-objcopy"
{% for b in binaries -%}
{%- set crates = [line | split(pat=" ") | first for line in exec(command="cargo tree --locked -p opensovd-" ~ b ~ " -e normal,build --prefix none --format {p}") | split(pat="\n") if config_root in line and "(*)" not in line] -%}
{%- set stage = data ~ "/" ~ b ~ "-" ~ triple -%}
cargo llvm-cov clean --workspace
export LLVM_PROFILE_FILE="$CARGO_TARGET_DIR/{{ b }}-%p-%16m.profraw"
{% if "unit" in tests %}cargo nextest run --locked --all-features{% for c in crates %} -p {{ c }}{% endfor %}
{% endif -%}
{% if "integration" in tests %}uv run --locked pytest tests/opensovd-{{ b }}{% for a in usage.args %} {{ a | quote }}{% endfor %}
{% endif -%}
reports {{ (config_root ~ "/target/reports/" ~ b ~ "/" ~ triple ~ "/coverage") | quote }} {{ (b ~ " on " ~ triple) | quote }}
rm -rf {{ stage | quote }} && mkdir -p {{ (stage ~ "/" ~ build_dir ~ "/deps") | quote }}
cp "$CARGO_TARGET_DIR"/{{ b }}-*.profraw {{ stage | quote }}
find "$CARGO_TARGET_DIR/{{ build_dir }}" "$CARGO_TARGET_DIR/{{ build_dir }}/deps" -maxdepth 1 -type f -perm -u+x ! -name '*.so' ! -name '*.dylib' | while IFS= read -r object; do
  "$objcopy" --only-section=__llvm_covfun --only-section=__llvm_covmap --only-section=__llvm_prf_names "$object" {{ stage | quote }}/"${object#"$CARGO_TARGET_DIR"/}"
done
tar -czf {{ (stage ~ ".tar.gz") | quote }} -C {{ stage | quote }} . && rm -rf {{ stage | quote }}
{% endfor -%}
{% endif -%}
'''

[tasks.container]
description = "Build and smoke-test the images"
extends = "binaries"
run = '''
{%- set triple = env?.CARGO_BUILD_TARGET or [l | split(pat=": ") | last for l in exec(command="rustc -vV") | split(pat="\n") if "host: " in l] | first -%}
{%- set arch = "amd64" if "x86_64-" in triple and "-linux-" in triple else ("arm64" if "aarch64-" in triple and "-linux-" in triple else "") -%}
{%- set build_dir = "target/" ~ (triple ~ "/" if env?.CARGO_BUILD_TARGET else "") ~ vars.profile -%}
{%- if not arch -%}
echo "no container platform for {{ triple }}" >&2 && exit 1
{%- else -%}
{%- for b in usage.binary or vars.binaries | split(pat=" ") -%}
mkdir -p dist/{{ arch }} && cp {{ build_dir }}/opensovd-{{ b }} dist/{{ arch }}/
{{- " " }}&& docker build --platform linux/{{ arch }} -f docker/Dockerfile.{{ b }} -t opensovd-{{ b }}:test .
{{- " " }}&& uv run --locked pytest tests/opensovd-{{ b }}/cli/test_version.py --opensovd-run="docker run --rm opensovd-{{ b }}:test"
{%- if not loop.last %} && {% endif %}
{%- endfor -%}
{%- endif -%}
'''

[tasks.licenses]
description = "Check dependency licenses and sources"
run = "cargo deny check licenses sources"

[tasks.advisories]
description = "Check dependencies for security advisories"
run = "cargo deny check advisories"
