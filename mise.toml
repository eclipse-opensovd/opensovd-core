min_version = "2026.9.18"

[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
python = "3.13.15"
uv = "0.12.17"
prek = "0.5.4"
ruff = "0.16.9"
ty = "0.0.84"
"github:convco/convco" = "0.6.3"
cargo-deny = "0.20.2"
"github:taiki-e/cargo-llvm-cov" = "0.9.0"
"github:nextest-rs/nextest" = { version = "0.9.146", version_prefix = "cargo-nextest-" }
git-cliff = "2.14.1"
gh = "2.102.0"
jq = "1.8.2"

[env]
UV_PYTHON = { value = "{% if tools.python %}{{ tools.python.path }}{% endif %}", tools = true }
UV_PYTHON_DOWNLOADS = "never"

[vars]
profile = "release-small"
binaries = "gateway mcp"

[task_templates.binaries]
usage = '''
arg "[binary]..." help="Binaries, all by default"
arg "[-- args]..."
'''

[tasks.ci]
description = "Run the checks CI runs"
depends = ["lint", "build", "test", "licenses", "advisories"]

[tasks.build]
description = "Build the release binaries"
extends = "binaries"
run = '''
{%- for b in usage.binary or vars.binaries | split(pat=" ") -%}
cargo build --locked --profile {{ vars.profile }} -p opensovd-{{ b }}{% for a in usage.args %} {{ a | quote }}{% endfor %}{% if not loop.last %} && {% endif %}
{%- endfor -%}
'''

[tasks.lint]
description = "Run the git hooks on all files"
run = "prek run --all-files --show-diff-on-failure"

[tasks.fmt]
description = "Check formatting with the pinned nightly rustfmt"
tools = { rust = { version = "nightly-2026-05-07", profile = "minimal", components = "rustfmt" } }
run = "cargo fmt --all -- --check"

[tasks.test]
description = "Run all tests"
depends = ["test:unit", "test:self", "test:integration"]

[tasks."test:unit"]
description = "Run the Rust tests"
extends = "binaries"
shell = "bash -c"
run = '''
{%- set triple = env?.CARGO_BUILD_TARGET or [l | split(pat=": ") | last for l in exec(command="rustc -vV") | split(pat="\n") if "host: " in l] | first -%}
set -e
junit="${CARGO_TARGET_DIR:-target}/nextest/default/junit.xml"
{% for b in usage.binary or vars.binaries | split(pat=" ") -%}
{%- set crates = [line | split(pat=" ") | first for line in exec(command="cargo tree --locked -p opensovd-" ~ b ~ " -e normal,build --prefix none --format {p}") | split(pat="\n") if config_root in line and "(*)" not in line] -%}
report={{ ("target/reports/" ~ b ~ "/" ~ triple ~ "/unit") | quote }}
rm -f "$junit"
status=0
cargo nextest run --locked --all-features{% for c in crates %} -p {{ c }}{% endfor %}{% for a in usage.args %} {{ a | quote }}{% endfor %} || status=$?
if [ -f "$junit" ]; then mkdir -p "$report" && cp "$junit" "$report/junit.xml"; fi
if [ "$status" -ne 0 ]; then exit "$status"; fi
cargo test --locked --doc --all-features{% for c in crates %} -p {{ c }}{% endfor %}
{% endfor -%}
'''

[tasks."test:self"]
description = "Run the pytest plugin self-tests"
run = "uv run --locked pytest opensovd-e2e/tests"

[tasks."test:integration"]
description = "Run the e2e tests"
extends = "binaries"
run = '''
{%- set triple = env?.CARGO_BUILD_TARGET or [l | split(pat=": ") | last for l in exec(command="rustc -vV") | split(pat="\n") if "host: " in l] | first -%}
{%- for b in usage.binary or vars.binaries | split(pat=" ") -%}
uv run --locked pytest tests/opensovd-{{ b }} --opensovd-profile={{ vars.profile }}
{%- if env?.CARGO_BUILD_TARGET %} --opensovd-target={{ triple }}{% endif %}
{{- " " }}--html=target/reports/{{ b }}/{{ triple }}/integration/index.html --self-contained-html --metadata Binary {{ b }} --metadata Target {{ triple }}
{%- for a in usage.args %} {{ a | quote }}{% endfor %}
{%- if not loop.last %} && {% endif %}
{%- endfor -%}
'''

[tasks.coverage]
description = "Collect coverage"
extends = "binaries"
usage = 'flag "--tests <tests>" default="unit,integration" help="Test stages to cover"'
env = { CARGO_TARGET_DIR = "{{ config_root }}/target/coverage" }
run = '''
{%- set triple = env?.CARGO_BUILD_TARGET or [l | split(pat=": ") | last for l in exec(command="rustc -vV") | split(pat="\n") if "host: " in l] | first -%}
{%- set tests = usage.tests | split(pat=",") -%}
llvm_cov_env=$(cargo llvm-cov show-env --sh)
eval "$llvm_cov_env"
report() { cargo llvm-cov report --ignore-filename-regex /opensovd-mocks/ "$@"; }
{% for b in usage.binary or vars.binaries | split(pat=" ") -%}
{%- set crates = [line | split(pat=" ") | first for line in exec(command="cargo tree --locked -p opensovd-" ~ b ~ " -e normal,build --prefix none --format {p}") | split(pat="\n") if config_root in line and "(*)" not in line] -%}
dir={{ (config_root ~ "/target/reports/" ~ b ~ "/" ~ triple ~ "/coverage") | quote }}
cargo llvm-cov clean --workspace
{% if "unit" in tests %}cargo nextest run --locked --all-features{% for c in crates %} -p {{ c }}{% endfor %}
{% endif -%}
{% if "integration" in tests %}uv run --locked pytest tests/opensovd-{{ b }}{% for a in usage.args %} {{ a | quote }}{% endfor %}
{% endif -%}
rm -rf "$dir" && mkdir -p "$dir"
report --json --output-path "$dir/coverage.json"
report --html --output-dir "$dir"
report --cobertura --output-path "$dir/cobertura.xml"
scripts/coverage-report.sh --name {{ (b ~ " on " ~ triple) | quote }} "$dir/coverage.json" > "$dir/summary.md"
scripts/coverage-report.sh --detail --name {{ (b ~ " on " ~ triple) | quote }} "$dir/coverage.json" > "$dir/detail.md"
scripts/coverage-report.sh --badge "$dir/coverage.json" > "$dir/badge.json"
{% endfor -%}
'''

[tasks.container]
description = "Build and smoke-test the images"
extends = "binaries"
run = '''
{%- set triple = env?.CARGO_BUILD_TARGET or [l | split(pat=": ") | last for l in exec(command="rustc -vV") | split(pat="\n") if "host: " in l] | first -%}
{%- set arch = "amd64" if "x86_64-" in triple and "-linux-" in triple else ("arm64" if "aarch64-" in triple and "-linux-" in triple else "") -%}
{%- set build_dir = "target/" ~ (triple ~ "/" if env?.CARGO_BUILD_TARGET else "") ~ vars.profile -%}
{%- if not arch -%}
echo "no container platform for {{ triple }}" >&2 && exit 1
{%- else -%}
{%- for b in usage.binary or vars.binaries | split(pat=" ") -%}
mkdir -p dist/{{ arch }} && cp {{ build_dir }}/opensovd-{{ b }} dist/{{ arch }}/
{{- " " }}&& docker build --platform linux/{{ arch }} -f docker/Dockerfile.{{ b }} -t opensovd-{{ b }}:test .
{{- " " }}&& uv run --locked pytest tests/opensovd-{{ b }}/cli/test_version.py --opensovd-run="docker run --rm opensovd-{{ b }}:test"
{%- if not loop.last %} && {% endif %}
{%- endfor -%}
{%- endif -%}
'''

[tasks.licenses]
description = "Check dependency licenses and sources"
run = "cargo deny check licenses sources"

[tasks.advisories]
description = "Check dependencies for security advisories"
run = "cargo deny check advisories"
