[package]
name = "opensovd-gateway"
version.workspace = true
description = "OpenSOVD diagnostics gateway"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "opensovd-gateway"
path = "src/main.rs"

[features]
default = ["jsonschema", "json-preserve-order", "mock", "http2", "tls", "mdns"]
jsonschema = ["opensovd-server/jsonschema", "dep:schemars"]
json-preserve-order = ["opensovd-server/json-preserve-order"]
mock = ["dep:opensovd-mocks"]
http2 = ["opensovd-server/http2"]
tls = ["opensovd-server/tls", "opensovd-extra/tls"]
mdns = ["opensovd-extra/mdns", "dep:socket2"]

[dependencies]
anyhow = { workspace = true }
brotli-decompressor = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
libcli = { workspace = true }
opensovd-server = { workspace = true }
opensovd-core = { workspace = true }
opensovd-extra = { workspace = true, features = ["auth", "federation", "trace"] }
opensovd-mocks = { workspace = true, optional = true }
opensovd-models = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["net", "rt", "signal", "time", "sync"] }
http = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors", "fs"] }
tracing = { workspace = true }
clap = { workspace = true, features = ["cargo", "derive", "env", "error-context", "help", "std", "usage"] }
socket2 = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { workspace = true }

[dev-dependencies]
hyper = { workspace = true, features = ["http1", "server"] }
tokio = { workspace = true, features = ["macros"] }

[build-dependencies]
libcli-build = { workspace = true }


[lints]
workspace = true
