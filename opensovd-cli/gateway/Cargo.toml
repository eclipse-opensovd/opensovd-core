[package]
name = "opensovd-gateway"
version.workspace = true
description = "OpenSOVD diagnostics gateway"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "opensovd-gateway"
path = "src/main.rs"

[features]
default = ["jsonschema", "json-preserve-order", "mock", "tls", "mdns"]
jsonschema = ["opensovd-server/jsonschema", "dep:schemars"]
json-preserve-order = ["opensovd-server/json-preserve-order"]
mock = ["dep:opensovd-mocks"]
tls = ["libcli/tls", "opensovd-server/tls"]
mdns = ["libcli/mdns", "opensovd-extra/mdns"]

[dependencies]
anyhow = { workspace = true }
http = { workspace = true }
libcli = { workspace = true, features = ["server"] }
opensovd-server = { workspace = true }
opensovd-core = { workspace = true }
opensovd-extra = { workspace = true, features = ["http-proxy", "trace"] }
opensovd-mocks = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "signal", "time", "sync"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
clap = { workspace = true, features = ["cargo", "derive", "env", "error-context", "help", "std", "usage"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[build-dependencies]
libcli-build = { workspace = true }


[lints]
workspace = true
