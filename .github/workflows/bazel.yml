name: Bazel Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  bazel_build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3.0.0

      - name: Build opensovd-gateway and opensovd-mdns
        run: bazel build //:opensovd-gateway //:opensovd-mdns

      - name: Test mDNS targets
        run: bazel test //opensovd-extra:mdns_test //opensovd-extra:mdns_http_proxy_usage_test

      - name: Query Bazel targets
        run: bazel query //...

      - name: Check downstream crate universe
        run: python3 tests/bazel_consumer_test.py
