name: Nix setup
description: Install nix, restore the cargo cache, and realise the dev shell from flake.nix.

inputs:
  cargo-cache:
    description: Restore the cargo build cache. Enable for jobs that invoke cargo.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31

    - if: inputs.cargo-cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci
        prefix-key: rust-${{ hashFiles('rust-toolchain.toml') }}

    # Fail here rather than inside the job's first real step.
    - shell: bash
      run: nix develop --no-update-lock-file --command true
