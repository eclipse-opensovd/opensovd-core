name: Nix setup
description: Install nix, restore the cargo cache, and realise a dev shell from flake.nix.

inputs:
  cargo-cache:
    description: Restore the cargo build cache. Enable for jobs that invoke cargo.
    required: false
    default: 'false'
  shell:
    description: Flake reference of the shell to realise. Jobs that only run static checks pass '.#lint'.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

    - if: inputs.cargo-cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        shared-key: ci
        prefix-key: rust-${{ hashFiles('rust-toolchain.toml', 'flake.lock') }}

    # Fail here rather than inside the job's first real step.
    - shell: bash
      env:
        SHELL_REF: ${{ inputs.shell }}
      run: nix develop "$SHELL_REF" --no-update-lock-file --command true
