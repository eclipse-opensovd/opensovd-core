name: Docker publish
description: Build a multi-arch Docker image from prebuilt artifacts and push all its platforms to GHCR together.

inputs:
  binary:
    description: Cargo package name; also used as the image suffix.
    required: true
  dockerfile:
    description: Path to the Dockerfile.
    required: true
  release-tag:
    description: Release tag (nightly | latest | vX.Y.Z).
    required: true
  dist-path:
    description: Directory holding the downloaded image-<binary>-<triple> artifacts.
    required: false
    default: dist

runs:
  using: composite
  steps:
    - name: Prepare platforms
      id: prepare
      shell: bash
      run: |
        shopt -s nullglob
        PLATFORMS=""
        for src in ${{ inputs.dist-path }}/image-${{ inputs.binary }}-*; do
          [ -d "$src" ] || continue
          target=$(basename "$src")
          target=${target#image-${{ inputs.binary }}-}
          case "$target" in
            x86_64-*-linux-*)  arch=amd64 ;;
            aarch64-*-linux-*) arch=arm64 ;;
            *) continue ;;
          esac
          ln -sfn "image-${{ inputs.binary }}-${target}" "${{ inputs.dist-path }}/${arch}"
          chmod +x "${{ inputs.dist-path }}/${arch}/${{ inputs.binary }}"
          [ -n "$PLATFORMS" ] && PLATFORMS="$PLATFORMS,"
          PLATFORMS="${PLATFORMS}linux/${arch}"
        done
        echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata from Cargo.toml
      id: cargo
      shell: bash
      run: |
        PKG=$(cargo metadata --format-version 1 --no-deps \
          | jq --arg name "${{ inputs.binary }}" '.packages[] | select(.name == $name)')
        echo "version=$(jq -r '.version' <<<"$PKG")"           >> "$GITHUB_OUTPUT"
        echo "description=$(jq -r '.description' <<<"$PKG")"   >> "$GITHUB_OUTPUT"
        echo "license=$(jq -r '.license' <<<"$PKG")"           >> "$GITHUB_OUTPUT"
        echo "repository=$(jq -r '.repository' <<<"$PKG")"     >> "$GITHUB_OUTPUT"

    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ inputs.binary }}
        tags: |
          type=raw,value=${{ inputs.release-tag }}
          type=raw,value=nightly-{{date 'YYYY-MM-DD'}},enable=${{ inputs.release-tag == 'nightly' }}
          type=raw,value=latest,enable=${{ inputs.release-tag == 'latest' || startsWith(inputs.release-tag, 'v') }}
        labels: |
          org.opencontainers.image.title=${{ inputs.binary }}
          org.opencontainers.image.description=${{ steps.cargo.outputs.description }}
          org.opencontainers.image.version=${{ steps.cargo.outputs.version }}
          org.opencontainers.image.licenses=${{ steps.cargo.outputs.license }}
          org.opencontainers.image.source=${{ steps.cargo.outputs.repository }}
        annotations: |
          index:org.opencontainers.image.description=${{ steps.cargo.outputs.description }}

    - id: push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        platforms: ${{ steps.prepare.outputs.platforms }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        cache-from: |
          type=gha,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-${{ github.ref_name }}
          type=gha,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-main
        cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-${{ github.ref_name }}

    - if: github.repository_owner == 'eclipse-opensovd'
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.binary }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
