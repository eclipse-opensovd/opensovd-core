name: Docker publish
description: Build a multi-arch Docker image from prebuilt artifacts and push all its platforms to GHCR together.

inputs:
  binary:
    description: Cargo package name; also used as the image suffix.
    required: true
  dockerfile:
    description: Path to the Dockerfile.
    required: true
  release-tag:
    description: Release tag (nightly | latest | vX.Y.Z).
    required: true
  dist-path:
    description: Directory holding the downloaded image-<binary>-<triple> artifacts.
    required: false
    default: dist

runs:
  using: composite
  steps:
    - name: Prepare platforms
      id: prepare
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
        DIST_PATH: ${{ inputs.dist-path }}
      run: |
        shopt -s nullglob
        PLATFORMS=""
        for src in "${DIST_PATH}/image-${BINARY}-"*; do
          [ -d "$src" ] || continue
          target=$(basename "$src")
          target=${target#image-"${BINARY}"-}
          case "$target" in
            x86_64-*-linux-*)  arch=amd64 ;;
            aarch64-*-linux-*) arch=arm64 ;;
            *) continue ;;
          esac
          ln -sfn "image-${BINARY}-${target}" "${DIST_PATH}/${arch}"
          chmod +x "${DIST_PATH}/${arch}/${BINARY}"
          [ -n "$PLATFORMS" ] && PLATFORMS="$PLATFORMS,"
          PLATFORMS="${PLATFORMS}linux/${arch}"
        done
        echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata from Cargo.toml
      id: cargo
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
      run: |
        PKG=$(cargo metadata --format-version 1 --no-deps \
          | jq --arg name "$BINARY" '.packages[] | select(.name == $name)')
        {
          echo "version=$(jq -r '.version' <<<"$PKG")"
          echo "description=$(jq -r '.description' <<<"$PKG")"
          echo "license=$(jq -r '.license' <<<"$PKG")"
          echo "repository=$(jq -r '.repository' <<<"$PKG")"
        } >> "$GITHUB_OUTPUT"

    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ inputs.binary }}
        tags: |
          type=raw,value=${{ inputs.release-tag }}
          type=raw,value=nightly-{{date 'YYYY-MM-DD'}},enable=${{ inputs.release-tag == 'nightly' }}
          type=raw,value=latest,enable=${{ inputs.release-tag == 'latest' || startsWith(inputs.release-tag, 'v') }}
        labels: |
          org.opencontainers.image.title=${{ inputs.binary }}
          org.opencontainers.image.description=${{ steps.cargo.outputs.description }}
          org.opencontainers.image.version=${{ steps.cargo.outputs.version }}
          org.opencontainers.image.licenses=${{ steps.cargo.outputs.license }}
          org.opencontainers.image.source=${{ steps.cargo.outputs.repository }}
        annotations: |
          index:org.opencontainers.image.description=${{ steps.cargo.outputs.description }}

    - id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        platforms: ${{ steps.prepare.outputs.platforms }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        cache-from: |
          type=gha,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-${{ github.ref_name }}
          type=gha,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-main
        cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-${{ github.ref_name }}

    - if: github.repository_owner == 'eclipse-opensovd'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.binary }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
