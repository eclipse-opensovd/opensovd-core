name: Docker publish
description: Build a multi-arch Docker image from prebuilt artifacts, smoke-test it, and push to GHCR.

inputs:
  binary:
    description: Cargo package name; also used as the image suffix and the local test tag.
    required: true
  dockerfile:
    description: Path to the Dockerfile.
    required: true
  release-tag:
    description: Release tag (nightly | latest | vX.Y.Z).
    required: true
  smoke-test-cmd:
    description: Optional shell command to run against the loaded test image (tagged ${binary}:test). When empty, the load build and smoke step are skipped.
    required: false
    default: ''
  dist-path:
    description: Directory holding the downloaded build artifacts.
    required: false
    default: dist

runs:
  using: composite
  steps:
    - name: Prepare platforms
      id: prepare
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
        DIST_PATH: ${{ inputs.dist-path }}
      run: |
        shopt -s nullglob
        PLATFORMS=""
        for src in "$DIST_PATH/$BINARY"-*; do
          [ -d "$src" ] || continue
          target=$(basename "$src")
          target=${target#"$BINARY-"}
          case "$target" in
            x86_64-*-linux-*)  arch=amd64 ;;
            aarch64-*-linux-*) arch=arm64 ;;
            *) continue ;;
          esac
          ln -sfn "$BINARY-${target}" "$DIST_PATH/${arch}"
          chmod +x "$DIST_PATH/${arch}/$BINARY"
          [ -n "$PLATFORMS" ] && PLATFORMS="$PLATFORMS,"
          PLATFORMS="${PLATFORMS}linux/${arch}"
        done
        echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata from Cargo.toml
      id: cargo
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
      run: |
        PKG=$(nix develop --command cargo metadata --format-version 1 --no-deps \
          | jq --arg name "$BINARY" '.packages[] | select(.name == $name)')
        echo "version=$(jq -r '.version' <<<"$PKG")"           >> "$GITHUB_OUTPUT"
        echo "description=$(jq -r '.description' <<<"$PKG")"   >> "$GITHUB_OUTPUT"
        echo "license=$(jq -r '.license' <<<"$PKG")"           >> "$GITHUB_OUTPUT"
        echo "repository=$(jq -r '.repository' <<<"$PKG")"     >> "$GITHUB_OUTPUT"

    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ inputs.binary }}
        tags: |
          type=raw,value=${{ inputs.release-tag }}
          type=raw,value=nightly-{{date 'YYYY-MM-DD'}},enable=${{ inputs.release-tag == 'nightly' }}
          type=raw,value=latest,enable=${{ inputs.release-tag == 'latest' || startsWith(inputs.release-tag, 'v') }}
        labels: |
          org.opencontainers.image.title=${{ inputs.binary }}
          org.opencontainers.image.description=${{ steps.cargo.outputs.description }}
          org.opencontainers.image.version=${{ steps.cargo.outputs.version }}
          org.opencontainers.image.licenses=${{ steps.cargo.outputs.license }}
          org.opencontainers.image.source=${{ steps.cargo.outputs.repository }}
        annotations: |
          index:org.opencontainers.image.description=${{ steps.cargo.outputs.description }}

    - if: inputs.smoke-test-cmd != ''
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        load: true
        tags: ${{ inputs.binary }}:test
        labels: ${{ steps.meta.outputs.labels }}
        build-args: TARGETARCH=amd64
        cache-from: |
          type=gha,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-${{ github.ref_name }}
          type=gha,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-main
        cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-${{ github.ref_name }}

    - if: inputs.smoke-test-cmd != ''
      name: Smoke test
      shell: bash
      env:
        SMOKE_CMD: ${{ inputs.smoke-test-cmd }}
      run: eval "$SMOKE_CMD"

    - id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        platforms: ${{ steps.prepare.outputs.platforms }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        cache-from: |
          type=gha,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-${{ github.ref_name }}
          type=gha,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-main
        cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}-${{ inputs.binary }}-${{ github.ref_name }}

    - if: github.repository_owner == 'eclipse-opensovd'
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.binary }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
