name: mise
description: Install mise at the version the dev container pins, then the tools from mise.toml.

inputs:
  tools:
    description: Tools to install; all tools by default.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        version=$(sed -n 's|^FROM ghcr.io/jdx/mise:\([^ @]*\)[^ ]* AS mise$|\1|p' .devcontainer/Dockerfile)
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: ${{ steps.version.outputs.version }}
        install_args: ${{ inputs.tools }}
        cache: ${{ github.ref_type != 'tag' && github.event_name != 'schedule' }}
