name: mise
description: Install mise at the version the dev container pins, then the tools from mise.toml.

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        version=$(sed -n 's|^FROM ghcr.io/jdx/mise:\([^ @]*\)[^ ]* AS mise$|\1|p' .devcontainer/Dockerfile)
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        version: ${{ steps.version.outputs.version }}
