[package]
name = "opensovd-diagnostic-lib"
version = "0.1.0"
edition = "2021"
authors = ["OpenSOVD Contributors"]
description = "Reusable diagnostic library for HPC applications to expose diagnostic data via HTTP API"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-opensovd/opensovd-core"
keywords = ["sovd", "diagnostic"]
categories = ["embedded"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
warp = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
schemars = { version = "0.8", features = ["preserve_order"] }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true, features = ["std"] }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
